<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINJOON</title>
    <meta name="description" content="민준이의 중학교 생존기. 채팅처럼 흘러가는 스토리와 미니게임으로 8학년을 버텨 보세요.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
    <style>
        /* Hallmark · redesign: full · scope: app (canvas game) · brand: Discord look, no marks (spec 2026-11-04)
         * critique: the page is only a frame for the canvas; its two colours are the game's rail and ink tokens */
        :root {
            --rail: #1e1f22;
            --ink: #dbdee1;
            --font: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        }
        html, body {
            margin: 0;
            height: 100%;
            background-color: var(--rail);
            overflow: hidden;
            overflow-x: clip;
        }
        #game-container {
            width: 100%;
            height: 100%;
        }
        .load-error {
            color: var(--ink);
            font-family: var(--font);
            padding: 16px;
        }
    </style>
    <!-- Phaser is loaded as a global from a local copy so the game runs offline without a build step. -->
    <script src="lib/phaser.min.js"></script>
</head>
<body>
    <div id="game-container"></div>
    <noscript><p class="load-error">이 게임은 자바스크립트를 켜야 실행됩니다.</p></noscript>
    <script type="module" src="src/main.js"></script>
</body>
</html>
